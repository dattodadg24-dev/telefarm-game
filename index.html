<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TeleFarm: Nông Trại Trên Mây</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- AdsGram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4cd137;
      --gold: #ffbe0b;
      --gem: #00a8ff;
      --sky: linear-gradient(180deg, #48dbfb 0%, #a0e7fd 60%, #dff9fb 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--sky);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      color: #2f3640;
    }

    /* Header Profile */
    header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .user-box { display: flex; align-items: center; gap: 10px; }
    .user-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fbc531;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 3px solid #fff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.12);
    }
    .user-meta .name { font-weight: 700; font-size: 14px; max-width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-meta .lv { font-size: 11px; color: #718093; font-weight: 600; }
    .currencies { display: flex; gap: 8px; }
    .pill {
      background: white;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pill.gold { color: #d48b00; }
    .pill.gem { color: #0984e3; }

    /* Action bar */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      gap: 6px;
    }

    .action-btn {
      background: white;
      border: none;
      padding: 7px 11px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 4px;
      color: #333;
    }
    .action-btn:active { transform: scale(0.96); }
    .action-btn.ad-btn { background: linear-gradient(135deg, #e67e22, #f39c12); color: white; }
    .action-btn.cashout { background: linear-gradient(135deg, #10ac84, #1dd1a1); color: white; }

    /* Farm Island Area */
    .farm-container {
      flex: 1;
      padding: 10px 14px 90px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .farm-island {
      background: rgba(255, 255, 255, 0.78);
      border-radius: 24px;
      padding: 16px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 3px solid #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .island-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }
    .island-title { font-family: 'Fredoka One', cursive; font-size: 16px; color: #2f3640; }

    .corgi-box {
      background: #fff;
      border: 2px solid #fbc531;
      border-radius: 16px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      margin-bottom: 16px;
      width: 100%;
      justify-content: center;
    }
    .corgi-box:active { transform: scale(0.98); }

    /* Plots Grid */
    .plots-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
    }

    .plot-cell {
      background: #966138;
      border: 3px solid #6b4020;
      border-radius: 18px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      box-shadow: 0 5px 0 #4a2810, inset 0 3px 8px rgba(0,0,0,0.3);
      transition: transform 0.1s;
      overflow: hidden;
    }
    .plot-cell:active { transform: translateY(3px); }
    .plot-cell.ripe {
      border-color: #2ed573;
      box-shadow: 0 5px 0 #4a2810, 0 0 12px rgba(46, 213, 115, 0.8);
    }
    .plot-cell .crop-icon { font-size: 36px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); }

    .plot-timer {
      position: absolute;
      top: 6px;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 1px 6px;
      border-radius: 8px;
    }

    .progress-bar {
      position: absolute;
      bottom: 6px;
      left: 10%;
      width: 80%;
      height: 6px;
      background: rgba(0,0,0,0.4);
      border-radius: 4px;
      overflow: hidden;
    }
    .
